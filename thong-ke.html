  <style>
    /* Khối thông tin lớn: không đóng khung, ngăn nhau bằng dải 10px màu divider chạy hết chiều ngang màn hình */
    .rank-section { margin: 0; }
    .section-divider { height: 10px; background: var(--bg-hover); width: 100vw; margin: 24px 0 24px calc(50% - 50vw); }
    /* Desktop: giữ giao diện cũ — mỗi khối xếp hạng đóng khung như .card, không dải ngăn */
    @media (min-width: 768px) {
      .rank-section { background: var(--bg-surface); border: 1px solid var(--bg-border); border-radius: var(--radius-xl); padding: var(--space-4); margin-bottom: 20px; }
      .section-divider { display: none; }
      /* Hai khối một hàng: Top thắng | Top quả tạ, Chuỗi thắng | Chuỗi thua */
      .rank-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 20px; }
      .rank-grid > .rank-section { margin-bottom: 0; }
      .rank-section--win { order: 1; } .rank-section--lose { order: 2; }
      .rank-section--streak-win { order: 3; } .rank-section--streak-lose { order: 4; }
    }
    /* Phạm vi thống kê: theo năm / tất cả */
    /* Bục 1-2-3 lần lượt mọc lên khi vẽ: hạng 1 trước, rồi 2, rồi 3 */
    @media (prefers-reduced-motion: no-preference) {
      body[data-active="thong-ke"] .podium-card { transform-origin: 50% 100%; animation: podiumRise .55s cubic-bezier(.34,1.45,.64,1) both; }
      body[data-active="thong-ke"] .podium-card--2 { animation-delay: .16s; }
      body[data-active="thong-ke"] .podium-card--3 { animation-delay: .32s; }
      body[data-active="thong-ke"] .podium-card .podium-medal,
      body[data-active="thong-ke"] .podium-card .podium-name,
      body[data-active="thong-ke"] .podium-card .podium-losses,
      body[data-active="thong-ke"] .podium-card .streak-range { animation: podiumText .35s ease-out both; animation-delay: inherit; }
      body[data-active="thong-ke"] .podium-card .podium-medal { animation-name: podiumMedal; animation-duration: .45s; }
      @keyframes podiumRise { from { opacity: 0; transform: translateY(28px) scaleY(.55); } to { opacity: 1; transform: none; } }
      @keyframes podiumText { 0%, 40% { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes podiumMedal { 0%, 35% { opacity: 0; transform: scale(.4); } 75% { transform: scale(1.12); } to { opacity: 1; transform: none; } }
    }
    /* Dòng mô tả (Năm 2026 · 37 trận) sát tiêu đề */
    body[data-active="thong-ke"] .thu-thang-page-title .text-h1 { line-height: 1.15; }
    body[data-active="thong-ke"] .thu-thang-page-title #stat-subtitle { margin-top: 2px; }
  </style>

<script>
  const BASE_YEAR = 2026;
  let _year = Math.max(BASE_YEAR, new Date().getFullYear()); // mặc định năm hiện tại
  let _scope = 'year';  // 'year' = năm đang chọn, 'all' = tất cả các năm
  let _S = null;
  const getWinnerIds = m => window._fcFinance.winnerIds(m);

  // ── Leaderboard ──────────────────────────────────────────
  function renderLeaderboard(matches, members) {
    const lossMap={};
    const lastLossMap={};
    matches.forEach(match=>{(match.losers||[]).forEach(l=>{lossMap[l.memberId]=(lossMap[l.memberId]||0)+1;const d=match.date||'';if(!lastLossMap[l.memberId]||d>lastLossMap[l.memberId])lastLossMap[l.memberId]=d;});});
    const fullRanking=Object.entries(lossMap).map(([id,n])=>({m:members.find(x=>x.id==id),n,lastLoss:lastLossMap[id]||''}))
      .filter(x=>x.m).sort((a,b)=>b.n-a.n||(b.lastLoss>a.lastLoss?1:b.lastLoss<a.lastLoss?-1:0));
    window._biafullRanking=fullRanking;
    const ranking=fullRanking.slice(0,5);
    const el=document.getElementById('bia-leaderboard');
    if(!ranking.length)el.innerHTML='<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:24px">Chưa có dữ liệu</div>';
    else {
    const podium=ranking.slice(0,3),rest=ranking.slice(3);
    const medals=['🥇','🥈','🥉'];
    const po=podium.length===1?[podium[0]]:podium.length===2?[podium[1],podium[0]]:[podium[1],podium[0],podium[2]];
    const pr=podium.length===1?[0]:podium.length===2?[1,0]:[1,0,2];
    el.innerHTML=`<div class="podium-wrap">${po.map((r,pi)=>{const rank=pr[pi]+1;return`<div class="podium-card podium-card--${rank}"><div class="podium-medal">${window.fcPodiumAvatar(r.m.name)}</div><div class="podium-name" title="${r.m.name}">${r.m.name}</div><div class="podium-losses">${r.n} trận</div></div>`;}).join('')}</div>`
      +(rest.length?`<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">${rest.map((r,i)=>`<div class="leaderboard-item"><div class="leaderboard-item__rank">${i+4}</div><div class="leaderboard-item__name">${r.m.name}</div><div class="leaderboard-item__losses">${r.n} trận</div></div>`).join('')}</div>`:'');
    }

    const winMap={},lastWinMap={};
    matches.forEach(match=>getWinnerIds(match).forEach(memberId=>{winMap[memberId]=(winMap[memberId]||0)+1;const d=match.date||'';if(!lastWinMap[memberId]||d>lastWinMap[memberId])lastWinMap[memberId]=d;}));
    const fullWinRanking=Object.entries(winMap).map(([id,n])=>({m:members.find(x=>x.id==id),n,lastWin:lastWinMap[id]||''})).filter(x=>x.m).sort((a,b)=>b.n-a.n||(b.lastWin>a.lastWin?1:b.lastWin<a.lastWin?-1:0));
    window._biaFullWinRanking=fullWinRanking;
    const winRanking=fullWinRanking.slice(0,5),winEl=document.getElementById('bia-win-leaderboard');
    if(!winRanking.length)winEl.innerHTML='<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:24px">Chưa có dữ liệu người thắng</div>';
    else {
      const podium=winRanking.slice(0,3),rest=winRanking.slice(3),medals=['🥇','🥈','🥉'];
      const po=podium.length===1?[podium[0]]:podium.length===2?[podium[1],podium[0]]:[podium[1],podium[0],podium[2]];
      const pr=podium.length===1?[0]:podium.length===2?[1,0]:[1,0,2];
      winEl.innerHTML=`<div class="podium-wrap">${po.map((r,pi)=>{const rank=pr[pi]+1;return`<div class="podium-card podium-card--${rank}"><div class="podium-medal">${window.fcPodiumAvatar(r.m.name)}</div><div class="podium-name" title="${r.m.name}">${r.m.name}</div><div class="podium-losses">${r.n} trận</div></div>`;}).join('')}</div>`+(rest.length?`<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">${rest.map((r,i)=>`<div class="leaderboard-item"><div class="leaderboard-item__rank">${i+4}</div><div class="leaderboard-item__name">${r.m.name}</div><div class="leaderboard-item__losses">${r.n} trận</div></div>`).join('')}</div>`:'');
    }
  }


  // ── Chuỗi phong độ ───────────────────────────────────────
  // Luật:
  //  - Trận không có ai thắng và không có ai thua = hoà → cắt chuỗi của mọi người.
  //  - Có tên trong danh sách thắng → +1 chuỗi thắng; danh sách thua → +1 chuỗi thua.
  //  - Không có tên ở cả hai (vắng) → chuỗi giữ nguyên. Tuần không đá cũng giữ nguyên.
  //  - Trận trước WIN_DATA_FROM chưa ghi người thắng: ai không thua thì cắt chuỗi
  //    (tuần đó có đá mà không thua), không tính chuỗi thắng.
  const WIN_DATA_FROM = '2026-08-07';
  function computeStreaks(matches) {
    const sorted = matches.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const cur = {};                     // memberId → {type, n, start, end}
    const best = { W: {}, L: {} };      // type → memberId → chuỗi dài nhất
    const allIds = new Set();
    sorted.forEach(m => { getWinnerIds(m).forEach(id=>allIds.add(id)); (m.losers||[]).forEach(l=>allIds.add(Number(l.memberId))); });
    const keep = (id, s) => {
      const b = best[s.type][id];
      if (!b || s.n > b.n || (s.n === b.n && s.end >= b.end)) best[s.type][id] = { ...s };
    };
    sorted.forEach(m => {
      const date = m.date || '';
      const W = new Set(getWinnerIds(m));
      const L = new Set((m.losers||[]).map(l=>Number(l.memberId)));
      if (!W.size && !L.size) { Object.keys(cur).forEach(id => delete cur[id]); return; } // hoà
      const hasWinData = W.size > 0 && date >= WIN_DATA_FROM;
      allIds.forEach(id => {
        let r = null;
        if (L.has(id)) r = 'L';
        else if (hasWinData && W.has(id)) r = 'W';
        else if (!W.size) { delete cur[id]; return; } // trận chưa ghi người thắng, không thua → cắt
        else return;                                   // vắng → giữ nguyên
        const c = cur[id];
        cur[id] = (c && c.type === r) ? { ...c, n: c.n + 1, end: date } : { type: r, n: 1, start: date, end: date };
        keep(id, cur[id]);
      });
    });
    return { best, cur };
  }
  function renderStreaks(matches, members) {
    const { best, cur } = computeStreaks(matches);
    const short = d => { const p = (d||'').split('-'); return p.length === 3 ? `${p[2]}/${p[1]}` : d; };
    const draw = (type, elId) => {
      const el = document.getElementById(elId); if (!el) return;
      const list = Object.entries(best[type])
        .map(([id, s]) => ({ m: members.find(x => x.id == id), s, live: cur[id] && cur[id].type === type && cur[id].start === s.start }))
        .filter(x => x.m && x.s.n >= 2)
        .sort((a, b) => b.s.n - a.s.n || (b.s.end > a.s.end ? 1 : b.s.end < a.s.end ? -1 : 0))
        .slice(0, 5);
      if (!list.length) { el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:24px">Chưa có chuỗi từ 2 trận trở lên</div>'; return; }
      // Chuỗi chưa bị cắt: thay ngày kết thúc bằng "nay" (tô màu, có chấm)
      const range = x => `${short(x.s.start)} → ${x.live ? `<span class="streak-live streak-live--${type}" title="Chuỗi đang tiếp diễn">nay</span>` : short(x.s.end)}`;
      const podium = list.slice(0, 3), rest = list.slice(3), medals = ['🥇','🥈','🥉'];
      const po = podium.length === 1 ? [podium[0]] : podium.length === 2 ? [podium[1], podium[0]] : [podium[1], podium[0], podium[2]];
      const pr = podium.length === 1 ? [0] : podium.length === 2 ? [1, 0] : [1, 0, 2];
      el.innerHTML = `<div class="podium-wrap">${po.map((x, pi) => { const rank = pr[pi] + 1; return `
          <div class="podium-card podium-card--${rank}">
            <div class="podium-medal">${window.fcPodiumAvatar(x.m.name)}</div>
            <div class="podium-name" title="${x.m.name}">${x.m.name}</div>
            <div class="podium-losses">${x.s.n} trận</div>
            <div class="streak-range">${range(x)}</div>
          </div>`; }).join('')}</div>`
        + (rest.length ? `<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">${rest.map((x, i) => `
          <div class="leaderboard-item">
            <div class="leaderboard-item__rank">${i + 4}</div>
            <div class="leaderboard-item__name">${x.m.name}<div class="streak-range">${range(x)}</div></div>
            <div class="leaderboard-item__losses">${x.s.n} trận</div>
          </div>`).join('')}</div>` : '');
    };
    draw('W', 'bia-streak-win');
    draw('L', 'bia-streak-lose');
  }


  // Trận dùng cho thống kê theo phạm vi đang chọn
  function scopeMatches(S) {
    const all = window._fcFinance.arr(S.matches).filter(Boolean);
    return _scope === 'all' ? all : all.filter(m => window._fcFinance.matchYear(m) === _year);
  }

  // Trang được báo vẽ lại nhiều lần khi mở (bản cache → đăng nhập → dữ liệu Firebase).
  // Số liệu không đổi thì bỏ qua — để hiệu ứng bục 1-2-3 chỉ chạy một lần, không giật lại.
  let _renderSig = null;
  function renderPage(S) {
    _S = S;
    const members = window._fcFinance.arr(S.members).filter(m => m && m.status !== 'left');
    const matches = scopeMatches(S);
    const sig = JSON.stringify([_scope, _year, members, matches]);
    if (sig === _renderSig) return;
    _renderSig = sig;
    document.getElementById('stat-subtitle').textContent = (_scope === 'all' ? 'Tất cả các năm' : `Năm ${_year}`) + ` · ${matches.length} trận`;
    renderLeaderboard(matches, members);
    renderStreaks(matches, members);
  }

  function updateYearUI() {
    const sel = document.getElementById('year-select');
    if (sel) {
      const curY = new Date().getFullYear(), maxY = Math.max(curY, BASE_YEAR);
      sel.innerHTML = '';
      // "Tất cả" đứng đầu, sau đó các năm mới → cũ; mặc định là năm hiện tại
      sel.add(new Option('Tất cả', 'all', false, _scope === 'all'));
      for (let y = maxY; y >= BASE_YEAR; y--) sel.add(new Option(String(y), y, false, _scope === 'year' && y === _year));
    }
    window._currentYear = _year;
  }

  window.onComponentsReady = function () {
    updateYearUI();
    document.getElementById('year-select')?.addEventListener('change', e => {
      if (e.target.value === 'all') _scope = 'all';
      else { _scope = 'year'; _year = parseInt(e.target.value, 10) || BASE_YEAR; }
      if (_S) renderPage(_S);
    });
    document.getElementById('page-content').style.opacity = '1';
  };
  // Bản cache báo sẵn sàng trước khi app.js khai báo xong _fcFinance → chờ một nhịp rồi vẽ
  window._onDataReady = function (S) {
    if (window._fcFinance) renderPage(S); else setTimeout(() => window._onDataReady(S), 0);
  };
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW register failed:', err));
    });
  }
</script>
