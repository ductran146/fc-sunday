<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>
    /* Theme: apply trước khi render để tránh flash */
    (function(){
      var t = localStorage.getItem('fc-sunday-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0C0C0F">
  <title>FC Sunday — Quỹ bia</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <!-- Mở sẵn kết nối tới máy chủ đăng nhập và database của Firebase -->
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fc-sunday-8f932-default-rtdb.asia-southeast1.firebasedatabase.app" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" async></script>
  <style>
    .month-tab {
      padding: 8px 16px; border-radius: var(--radius-full);
      font-size: 13px; font-weight: 600;
      background: var(--bg-elevated); color: var(--text-secondary);
      border: 1px solid var(--bg-border); cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .month-tab.active { background: rgba(255,192,46,.15); color: var(--color-primary); border-color: rgba(255,192,46,.3); }
    .loser-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: var(--radius-full);
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .12s;
    }
    .loser-paid   { background: rgba(46,204,113,.15); color: var(--color-success); border: 1px solid rgba(46,204,113,.3); }
    .loser-unpaid { background: rgba(224,57,44,.1);  color: var(--color-accent-light); border: 1px solid rgba(224,57,44,.2); }

    /* Tiêu đề form thêm/sửa trận (.dlg-head) dính ở đầu khi cuộn. Kéo giãn ra hết lề của
       .sheet (đệm trên 20px, hai bên 24px) để nền che kín nội dung cuộn bên dưới. */
    .sheet-head {
      position: sticky; top: calc(var(--space-5) * -1); z-index: 5;
      margin: calc(var(--space-5) * -1) calc(var(--sheet-pad-x) * -1) 20px;
      padding: 16px var(--sheet-pad-x); /* trên = dưới để tiêu đề và nút đóng nằm giữa thanh */
      background: var(--bg-surface);
    }
    @media (min-width: 768px) { /* desktop: .sheet đệm 24px mọi phía */
      .sheet-head { top: calc(var(--space-6) * -1); margin-top: calc(var(--space-6) * -1); }
    }
    /* ── Chia đội (form thêm/sửa trận) ──
       Chạm ô đội để chọn đội đang thêm, chạm tên ở "Chưa xếp đội" để đưa vào.
       Đội thua: chạm tên đổi đã đóng/chưa đóng, chạm × để bỏ ra. */
    .team-board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .team { border-radius: 14px; padding: 10px; min-height: 110px; border: 1.5px dashed var(--bg-border); background: var(--bg-surface); cursor: pointer; transition: border-color .12s, background .12s; }
    .team.is-active { border-style: solid; }
    .team--w.is-active { border-color: rgba(46,204,113,.6); background: rgba(46,204,113,.06); }
    .team--l.is-active { border-color: rgba(224,57,44,.6); background: rgba(224,57,44,.06); }
    .team__head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; margin-bottom: 8px; }
    .team--w .team__head { color: var(--color-success); }
    .team--l .team__head { color: var(--color-accent-light); }
    .team__list { display: flex; flex-wrap: wrap; gap: 6px; }
    .team__empty { font-size: 12px; color: var(--text-muted); }
    .team__note { margin-top: 8px; font-size: 11px; color: var(--text-muted); }
    .team-chip { display: inline-flex; align-items: center; height: 30px; border-radius: 999px; font: 600 12px var(--font-sans); overflow: hidden; }
    .team-chip button { height: 100%; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .team-chip__name { padding: 0 4px 0 10px; display: inline-flex; align-items: center; gap: 4px; }
    .team-chip__x { padding: 0 9px 0 4px; opacity: .75; }
    .team-chip--w { background: rgba(46,204,113,.15); color: var(--color-success); }
    .team-chip--l { background: rgba(224,57,44,.15); color: var(--color-accent-light); }
    .team-chip--lp { background: rgba(46,204,113,.15); color: var(--color-success); }
    .team-pool-title { margin: 12px 0 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .team-pool-title span { font-weight: 500; color: var(--text-muted); }
    .team-pool { display: flex; flex-wrap: wrap; gap: 8px; }
    .team-pool__chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--bg-stroke); background: var(--bg-elevated); color: var(--text-secondary); font: 600 13px var(--font-sans); cursor: pointer; }
    .team-pool__empty { font-size: 13px; color: var(--text-muted); }
    .month-accordion-card { border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--bg-border); background: var(--bg-surface); }
    .month-accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; cursor: pointer;
      background: var(--bg-elevated);
      user-select: none;
      transition: background .12s;
    }
    .month-accordion-header:hover { background: var(--bg-stroke); }
    .month-accordion-title { font-size: 16px; font-weight: 700; }
    .month-accordion-body { display: none; padding: 16px 0 0; display:flex; flex-direction:column; gap:0px; }
    .month-accordion-card:not(.is-open) .month-accordion-body { display: none; }
    .month-accordion-chevron { font-size: 20px; color: var(--text-muted); transition: transform .2s; flex-shrink: 0; }
    .month-accordion-card.is-open .month-accordion-chevron { transform: rotate(180deg); }

    /* Month summary chips */
    .month-summary-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 16px; }
    .month-add-wrap { padding: 20px; }
    /* Khối thông tin lớn: không đóng khung, ngăn nhau bằng dải 10px màu divider chạy hết chiều ngang màn hình */
    .section-divider { height: 10px; background: var(--bg-hover); width: 100vw; margin: 24px 0 24px calc(50% - 50vw); }
    /* Desktop: giữ giao diện cũ — mỗi khối xếp hạng đóng khung như .card, không dải ngăn */
    @media (min-width: 768px) {
      .section-divider { display: none; }
      /* 4 ô số liệu cùng một hàng */
      .grid-2-fixed.bia-kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    /* Chip tóm tắt: desktop chữ đầy đủ, điện thoại chữ gọn */
    .chip-short { display: none; }
    @media (max-width: 767px) { .chip-full { display: none; } .chip-short { display: inline; } }
    @media (max-width: 767px) { .month-add-wrap { padding: 12px; } }

    /* ── Lưới 3 tháng một hàng, kiểu tab (mọi cỡ màn hình) ──
       Ô tên tháng đứng yên trong lưới; danh sách trận của tháng đang chọn hiện
       ở khung riêng ngay dưới hàng chứa tháng đó. Thẻ tháng dùng display:contents
       để tiêu đề và nội dung là ô trực tiếp của lưới; order do layoutMonthGrid() gán. */
    .month-grid {
      --mg-gap: 12px; --mg-active-bg: var(--bg-elevated); /* trùng nền tiêu đề cột bảng */ --mg-sep: rgba(255,255,255,.08);
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--mg-gap); align-items: start;
    }
    [data-theme="light"] .month-grid { --mg-sep: rgba(0,0,0,.08); }
    .month-grid > .month-accordion-card { display: contents; }
    .month-grid .month-accordion-header {
      border: 1px solid var(--bg-border); border-radius: var(--radius-xl); gap: 6px;
      justify-content: center; height: 44px; padding: 0 20px;
    }
    .month-grid .month-accordion-title { white-space: nowrap; }
    .month-grid .month-accordion-chevron { display: none; }
    /* Tab đang chọn + khung trận là một khối có viền chung: tab bỏ viền dưới,
       kéo dài xuống thêm (khoảng cách lưới + 1px) để nền đặc của tab phủ lên
       viền trên của khung, chỗ nối liền mạch. */
    .month-grid .month-accordion-card.is-open .month-accordion-header {
      position: relative; z-index: 2;
      background: var(--mg-active-bg);
      border-color: var(--bg-border); border-bottom-color: transparent;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      height: calc(44px + var(--mg-gap) + 1px); padding-bottom: calc(var(--mg-gap) + 1px);
      margin-bottom: calc((var(--mg-gap) + 1px) * -1);
    }
    .month-grid .month-accordion-card.is-open .month-accordion-header:hover { background: var(--mg-active-bg); }
    /* Góc bo lõm 16px ở hai bên chân tab, chỗ nối vào khung: viền uốn từ khung
       lên tab; phần cung lấn lên nằm trong chỗ khuyết ở góc nút bên cạnh.
       Vẽ bằng radial-gradient: trong vòng tròn trong suốt, vành 1px màu viền,
       ngoài vòng tô nền khối. */
    .month-grid .month-accordion-card.is-open .month-accordion-header { --mg-r: 16px; }
    .month-grid .month-accordion-card.is-open .month-accordion-header::before,
    .month-grid .month-accordion-card.is-open .month-accordion-header::after {
      content: ''; position: absolute; bottom: -1px; /* tính từ trong viền dưới 1px của tab */
      width: var(--mg-r); height: var(--mg-r); pointer-events: none;
    }
    .month-grid .month-accordion-card.is-open .month-accordion-header::before {
      left: calc(var(--mg-r) * -1);
      background: radial-gradient(circle at 0 0, transparent calc(var(--mg-r) - 1px), var(--bg-border) calc(var(--mg-r) - 1px), var(--bg-border) var(--mg-r), var(--mg-active-bg) calc(var(--mg-r) + .5px));
    }
    .month-grid .month-accordion-card.is-open .month-accordion-header::after {
      right: calc(var(--mg-r) * -1);
      background: radial-gradient(circle at 100% 0, transparent calc(var(--mg-r) - 1px), var(--bg-border) calc(var(--mg-r) - 1px), var(--bg-border) var(--mg-r), var(--mg-active-bg) calc(var(--mg-r) + .5px));
    }
    /* Tab ở cột ngoài cùng: phía sát mép khung không có góc lõm (viền chạy thẳng) */
    .month-grid .month-accordion-header[data-col="first"]::before,
    .month-grid .month-accordion-header[data-col="last"]::after { display: none; }
    .month-grid .month-accordion-card.is-open .month-accordion-title { color: var(--color-primary); }
    .month-grid .month-accordion-body {
      grid-column: 1 / -1; padding: 0;
      border: 1px solid var(--bg-border); border-radius: var(--radius-xl);
      background: var(--mg-active-bg); overflow: hidden;
    }
    .month-grid .month-accordion-body .match-item { background: transparent; border-top: 1px solid var(--mg-sep); padding: 12px 20px; }
    .month-grid .month-accordion-body[data-col="first"] { border-top-left-radius: 0; }
    .month-grid .month-accordion-body[data-col="last"]  { border-top-right-radius: 0; }
    .month-grid > .month-empty { grid-column: 1 / -1; }
    .month-summary-chips { padding: 12px 20px; }
    /* Điện thoại: gọn hơn */
    @media (max-width: 767px) {
      .month-grid { --mg-gap: 8px; }
      .month-grid .month-accordion-header { padding: 0 12px; }
      .month-grid .month-accordion-title { font-size: 15px; }
      .month-grid .month-accordion-body .match-item { padding: 12px; }
      /* Chip tóm tắt: một dòng, chia đều, quá hẹp thì cuộn ngang */
      .month-summary-chips { flex-wrap: nowrap; padding: 12px; overflow-x: auto; }
      .month-summary-chips .month-chip { flex: 1 0 auto; justify-content: center; white-space: nowrap; }
    }
    .month-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: var(--radius-full);
      font-size: 12px; font-weight: 700;
      background: var(--bg-elevated); color: var(--text-secondary);
      border: 1px solid var(--bg-border);
    }
    .month-chip--total { background: rgba(224,57,44,.1); color: var(--color-accent-light); border-color: rgba(224,57,44,.2); }
    .month-chip--extra { background: var(--bg-elevated); color: var(--text-primary); }
    .month-chip--debt  { background: rgba(255,192,46,.1); color: var(--color-primary); border-color: rgba(255,192,46,.25); }

    /* Match item */
    .match-item { background: var(--bg-surface); padding: 12px 20px; border-top: 10px solid var(--bg-hover); }
    .match-item__header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .match-item__num {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      background: var(--bg-border); color: var(--text-secondary);
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .match-item__date { font-size: 15px; font-weight: 700; }
    .match-item__losers { display: flex; flex-wrap: wrap; gap: 6px; }
    .match-item__team-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .match-item__team-label { width: 58px; padding-top: 5px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .winner-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: var(--radius-full);
      background: rgba(46,204,113,.12); color: var(--color-success);
      border: 1px solid rgba(46,204,113,.28);
      font-size: 12px; font-weight: 600;
    }
    .match-item__extra {
      font-size: 12px; color: var(--text-secondary);
      padding: 6px 10px; border-radius: var(--radius-sm);
      background: rgba(255,192,46,.06); border: 1px solid rgba(255,192,46,.15);
      margin-bottom: 6px;
    }
    .match-item__summary { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .match-item__summary strong { color: var(--text-primary); font-weight: 700; }
    .match-item__actions { display: flex; justify-content: flex-end; margin-top: 8px; }

  </style>
</head>
<body data-active="thu-phat">
<div class="app-shell">
  <div data-component="sidebar"></div>
  <div class="main-content">
    <div data-component="header" data-title="Quỹ bia"></div>
    <!-- Thu quỹ: 2 tab Quỹ tháng / Quỹ bia (mỗi tab là một trang), nền liền với header -->
    <div class="fund-tabs-bar">
      <nav class="fund-tabs" aria-label="Thu quỹ">
        <a class="fund-tab" href="thu-thang.html"><span class="fund-tab__in"><span class="fund-tab__ic tf" aria-hidden="true">💰</span>Quỹ tháng</span></a>
        <a class="fund-tab active" href="thu-phat.html" aria-current="page"><span class="fund-tab__in"><span class="fund-tab__ic tf" aria-hidden="true">🍺</span>Quỹ bia</span></a>
      </nav>
    </div>
    <main class="page" id="page-content" style="opacity:0">

      <div class="thu-thang-page-header">
        <div class="thu-thang-page-title">
          <h1 class="sr-only">Quỹ bia</h1>
          <div class="thu-thang-page-subtitle" style="font-size:12px;color:var(--text-muted)">50.000 / người / trận thua</div>
        </div>
        <select class="year-selector thu-thang-year-selector" id="year-select">
          <!-- options injected by JS -->
        </select>
      </div>

      <!-- KPI 2x2 -->
      <div class="grid-2-fixed bia-kpi-grid" style="margin-bottom:20px">
        <div class="kpi-card kpi-card--gold">
          <div class="kpi-card__label">Tổng thu bia</div>
          <div class="kpi-card__value" id="kpi-thu-bia">0</div>
        </div>
        <div class="kpi-card kpi-card--red">
          <div class="kpi-card__label">Còn nợ</div>
          <div class="kpi-card__value" id="kpi-con-no">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">Số trận</div>
          <div class="kpi-card__value" id="kpi-so-tran">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card__label">Người còn nợ</div>
          <div class="kpi-card__value" id="kpi-nguoi-no">0</div>
        </div>
      </div>

      <!-- Leaderboard full width -->

      <!-- Monthly accordion -->
      <div class="section-divider" aria-hidden="true"></div>
      <div id="month-accordion" class="month-grid"></div>

      <!-- Save bar (pending changes) -->
      <div class="save-bar" id="bia-save-bar" hidden>
        <button class="save-bar__btn btn-cancel" type="button" onclick="cancelBiaChanges()">Huỷ</button>
        <button class="save-bar__btn save-bar__btn--save" id="bia-save-btn" type="button" onclick="saveBiaChanges()">Lưu</button>
      </div>
    </main>
  </div>
  <div data-component="bottom-nav"></div>
</div>

<!-- Match modal (thêm / sửa trận) -->
<div class="sheet-backdrop" id="match-modal" style="display:none" role="dialog" aria-modal="true">
  <div class="sheet fade-in">
    <div class="modal-handle"></div>
    <div class="dlg-head sheet-head">
      <div class="dlg-head__text"><h2 class="dlg-head__title" id="match-modal-title">Thêm trận đấu</h2></div>
      <button class="btn btn-close" aria-label="Đóng" onclick="closeMatchModal()">
        <svg class="btn-close__ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="field">
        <label>Ngày thi đấu</label>
        <button type="button" class="input" id="match-date-btn"
          style="text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px"
          onclick="window.DatePicker?.open('match-date','match-date-display')">
          <iconify-icon icon="solar:calendar-linear" style="font-size:18px;color:var(--text-muted);flex-shrink:0"></iconify-icon>
          <span id="match-date-display" style="color:var(--text-primary)">Chọn ngày</span>
        </button>
        <input type="hidden" id="match-date">
      </div>
      <div class="field">
        <label>Chia đội</label>
        <div class="team-board">
          <div class="team team--w is-active" data-team="w" onclick="setActiveTeam('w')" role="button" aria-pressed="true">
            <div class="team__head"><span>🏆 Đội thắng</span><span id="team-count-w">0</span></div>
            <div class="team__list" id="team-list-w"></div>
          </div>
          <div class="team team--l" data-team="l" onclick="setActiveTeam('l')" role="button" aria-pressed="false">
            <div class="team__head"><span>✕ Đội thua</span><span id="team-count-l">0</span></div>
            <div class="team__list" id="team-list-l"></div>
            <div class="team__note">Chạm tên: đã đóng / chưa đóng</div>
          </div>
        </div>
        <div class="team-pool-title">Chưa xếp đội <span>· chạm để thêm vào <b id="team-active-name">đội thắng</b></span></div>
        <div class="team-pool" id="team-pool"></div>
      </div>
      <div class="field">
        <label>Thu thêm (nếu có)</label>
        <input type="text" inputmode="numeric" class="input" id="match-thu-them" placeholder="0" autocomplete="off" data-money>
      </div>
      <div class="field">
        <label>Ghi chú thu thêm</label>
        <input type="text" class="input" id="match-ghi-chu" placeholder="VD: Thu bù trận cũ">
      </div>
      <div class="action-row" style="margin-top:4px">
        <button class="btn btn-cancel btn-surface action-row__cancel" type="button" onclick="closeMatchModal()">Huỷ</button>
        <button class="btn btn-primary action-row__primary" id="btn-save-match">
          <iconify-icon icon="solar:check-circle-linear" style="font-size:18px"></iconify-icon>
          Lưu trận
        </button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Inline DatePicker ── */
window.DatePicker=(function(){'use strict';function _ld(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}const MV=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];const DOW=['CN','T2','T3','T4','T5','T6','T7'];let _y,_m,_sel,_hid,_dis;function fmtVN(d){if(!d)return'Chọn ngày';const[y,m,dd]=d.split('-');return`${parseInt(dd)} ${MV[parseInt(m)-1]}, ${y}`;}function setVal(d){const h=document.getElementById(_hid),s=document.getElementById(_dis);if(h)h.value=d;if(s){s.textContent=fmtVN(d);s.style.color=d?'var(--text-primary)':'var(--text-muted)';}}function render(){const lb=document.getElementById('_dp_label');if(lb)lb.textContent=`${MV[_m]}, ${_y}`;const g=document.getElementById('_dp_days');if(!g)return;const fd=new Date(_y,_m,1).getDay(),dim=new Date(_y,_m+1,0).getDate(),ts=_ld(new Date());let h='';for(let i=0;i<fd;i++)h+='<div></div>';for(let d=1;d<=dim;d++){const ds=`${_y}-${String(_m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const isSel=ds===_sel,isTod=ds===ts;let bg='transparent',col='var(--text-primary)',fw='500';if(isSel){bg='var(--color-primary)';col='#1a1206';fw='800';}else if(isTod){bg='rgba(255,192,46,.15)';col='var(--color-primary)';fw='700';}h+=`<button type="button" style="padding:9px 0;text-align:center;font-size:13px;font-weight:${fw};border:none;cursor:pointer;border-radius:var(--radius-md);background:${bg};color:${col};font-family:var(--font-sans)" onclick="DatePicker._pick('${ds}')">${d}</button>`;}g.innerHTML=h;}function ensure(){if(document.getElementById('_dp_modal'))return;const el=document.createElement('div');el.className='modal-backdrop';el.id='_dp_modal';el.style.display='none';el.innerHTML=`<div class="modal fade-in" style="max-width:340px;padding:20px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><button class="btn btn-icon btn-ghost" onclick="DatePicker._prev()"><iconify-icon icon="solar:arrow-left-linear" style="font-size:18px"></iconify-icon></button><div style="font-size:15px;font-weight:700" id="_dp_label"></div><button class="btn btn-icon btn-ghost" onclick="DatePicker._next()"><iconify-icon icon="solar:arrow-right-linear" style="font-size:18px"></iconify-icon></button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">${DOW.map(d=>`<div style="text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);padding:4px">${d}</div>`).join('')}</div><div id="_dp_days" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px"></div><div style="display:flex;justify-content:space-between;margin-top:14px"><button class="btn btn-ghost btn-sm" onclick="DatePicker._today()">Hôm nay</button><button class="btn btn-ghost btn-sm" onclick="DatePicker.close()">Đóng</button></div></div>`;el.addEventListener('click',e=>{if(e.target===el)DatePicker.close();});document.body.appendChild(el);}return{init(b,h,d,def){ensure();_hid=h;_dis=d;setVal(def||_ld(new Date()));},open(h,d){ensure();_hid=h;_dis=d;const c=document.getElementById(h)?.value;const r=c?new Date(c+'T00:00:00'):new Date();_y=r.getFullYear();_m=r.getMonth();_sel=c||'';render();document.getElementById('_dp_modal').style.display='flex';},close(){const m=document.getElementById('_dp_modal');if(m)m.style.display='none';},_pick(d){_sel=d;setVal(d);this.close();},_prev(){_m--;if(_m<0){_m=11;_y--;}render();},_next(){_m++;if(_m>11){_m=0;_y++;}render();},_today(){const t=new Date();_y=t.getFullYear();_m=t.getMonth();_sel=_ld(t);render();},getValue(h){return document.getElementById(h)?.value||'';},setValue(h,d,v){_hid=h;_dis=d;setVal(v);}};})();
</script>

<script src="app.js" defer></script>
<script src="components/components-loader.js" defer></script>
<script>
  const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
  const MONTHS_FULL = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6',
                       'Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  const FINE = 50000, BASE_YEAR = 2026;
  let _year = Math.max(BASE_YEAR, new Date().getFullYear()), _S = null; // mặc định năm hiện tại (không nhỏ hơn năm gốc)
  const _openMonths = new Set([new Date().getMonth()]);
  let _editMatchId = null;

  function fmt(n) { return new Intl.NumberFormat('vi-VN').format(n); }
  // Dạng gọn cho chip tóm tắt tháng: 450000 → "450K"
  function chipK(n) { return fmtK(n).replace(/\s+/g, ''); }
  function fmtK(n) { return n === 0 ? '0' : (n / 1000).toLocaleString('vi-VN', {maximumFractionDigits: 0}) + ' K'; }
  function fmtDate(d) { if(!d) return '—'; const p=d.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
  function getYearMatches(S) {
    return (S.matches||[]).filter(m=>_year===BASE_YEAR?(!m.year||m.year===BASE_YEAR):m.year===_year);
  }
  function getWinnerIds(match) {
    const raw = match?.winners;
    const list = Array.isArray(raw) ? raw : Object.values(raw || {});
    return list.map(w => Number(typeof w === 'object' ? w.memberId : w)).filter(Number.isFinite);
  }
  // ── Chia đội ─────────────────────────────────────────────
  // _team: memberId → 'w' (thắng) | 'l' (thua, chưa đóng) | 'lp' (thua, đã đóng)
  let _team = new Map();
  let _activeTeam = 'w';
  window.setActiveTeam = function(t) {
    _activeTeam = t;
    document.querySelectorAll('.team-board .team').forEach(el => {
      const on = el.dataset.team === t;
      el.classList.toggle('is-active', on);
      el.setAttribute('aria-pressed', String(on));
    });
    const nm = document.getElementById('team-active-name');
    if (nm) nm.textContent = t === 'w' ? 'đội thắng' : 'đội thua';
  };
  window.teamAdd = function(id, ev) { ev?.stopPropagation(); _team.set(id, _activeTeam === 'w' ? 'w' : 'l'); renderTeamBoard(); };
  window.teamRemove = function(id, ev) { ev?.stopPropagation(); _team.delete(id); renderTeamBoard(); };
  window.teamTogglePaid = function(id, ev) { ev?.stopPropagation(); const v = _team.get(id); if (v === 'l' || v === 'lp') _team.set(id, v === 'l' ? 'lp' : 'l'); renderTeamBoard(); };
  function renderTeamBoard() {
    const members = (_S?.members || []).filter(m => m.status !== 'left');
    // Người đá nhiều xếp đầu danh sách "Chưa xếp đội"
    const plays = {};
    (_S?.matches || []).forEach(m => {
      (m.losers || []).forEach(l => { plays[l.memberId] = (plays[l.memberId] || 0) + 1; });
      getWinnerIds(m).forEach(id => { plays[id] = (plays[id] || 0) + 1; });
    });
    const byId = id => members.find(m => Number(m.id) === id);
    const W = [], L = [];
    _team.forEach((v, id) => { const m = byId(id); if (!m) return; (v === 'w' ? W : L).push([m, v]); });
    const chip = (m, v) => v === 'w'
      ? `<span class="team-chip team-chip--w"><button class="team-chip__name" onclick="teamRemove(${m.id}, event)">${m.name}</button><button class="team-chip__x" aria-label="Bỏ ${m.name}" onclick="teamRemove(${m.id}, event)">×</button></span>`
      : `<span class="team-chip team-chip--${v}"><button class="team-chip__name" title="${v === 'lp' ? 'Đã đóng' : 'Chưa đóng'} – chạm để đổi" onclick="teamTogglePaid(${m.id}, event)">${v === 'lp' ? '✓' : '✕'} ${m.name}</button><button class="team-chip__x" aria-label="Bỏ ${m.name}" onclick="teamRemove(${m.id}, event)">×</button></span>`;
    const empty = '<span class="team__empty">Chưa có ai</span>';
    document.getElementById('team-list-w').innerHTML = W.map(([m, v]) => chip(m, v)).join('') || empty;
    document.getElementById('team-list-l').innerHTML = L.map(([m, v]) => chip(m, v)).join('') || empty;
    document.getElementById('team-count-w').textContent = W.length;
    document.getElementById('team-count-l').textContent = L.length;
    const pool = members.filter(m => !_team.has(Number(m.id))).sort((a, b) => (plays[b.id] || 0) - (plays[a.id] || 0));
    document.getElementById('team-pool').innerHTML = pool.map(m => `<button type="button" class="team-pool__chip" onclick="teamAdd(${m.id}, event)">${m.name}</button>`).join('')
      || '<span class="team-pool__empty">Đã xếp hết thành viên</span>';
  }

  // ── Match modal ──────────────────────────────────────────
  window.closeMatchModal = function() {
    document.getElementById('match-modal').style.display='none'; _editMatchId=null;
  };
  document.getElementById('match-modal')?.addEventListener('click', e=>{
    if(e.target===document.getElementById('match-modal')) closeMatchModal();
  });

  function openMatchModal(targetMi, editId) {
    if(!window._isLoggedIn?.()) return;
    _editMatchId = editId ?? null;
    _team = new Map();
    setActiveTeam('w');
    const isEdit = _editMatchId !== null;
    document.getElementById('match-modal-title').textContent = isEdit ? 'Sửa trận đấu' : `Thêm trận — ${MONTHS_FULL[targetMi]}`;
    if(isEdit) {
      const match=(_S?.matches||[]).find(m=>m.id==_editMatchId);
      if(match) {
        getWinnerIds(match).forEach(id => _team.set(Number(id), 'w'));
        (match.losers||[]).forEach(l => _team.set(Number(l.memberId), l.paid ? 'lp' : 'l'));
        document.getElementById('match-date').value=match.date||'';
        window.DatePicker?.setValue('match-date','match-date-display', match.date||'');
        document.getElementById('match-thu-them').value=match.thuThem||'';
        document.getElementById('match-ghi-chu').value=match.ghiChuThem||'';
      }
    } else {
      const today=new Date(),y=_year,mo=targetMi;
      const def=new Date(y,mo,mo===today.getMonth()&&y===today.getFullYear()?today.getDate():1);
      const defStr = `${def.getFullYear()}-${String(def.getMonth()+1).padStart(2,'0')}-${String(def.getDate()).padStart(2,'0')}`;
      window.DatePicker?.setValue('match-date','match-date-display', defStr);
      document.getElementById('match-thu-them').value='';
      document.getElementById('match-ghi-chu').value='';
    }
    renderTeamBoard();
    document.getElementById('match-modal').style.display='flex';
    const sh=document.querySelector('#match-modal .sheet'); if(sh) sh.scrollTop=0;
  }
  window.openAddMatch  = function(mi)      { openMatchModal(mi, null); };
  window.openEditMatch = function(matchId) {
    const m=(_S?.matches||[]).find(m=>m.id==matchId); if(m) openMatchModal(m.monthIdx, matchId);
  };

  // ── Pending state ────────────────────────────────────────
  let _lastSavedS = null;
  let _hasBiaChanges = false;

  function setBiaPending(has) {
    _hasBiaChanges = !!has;
    const bar = document.getElementById('bia-save-bar');
    if (bar) bar.hidden = !_hasBiaChanges;
  }

  window.togglePaid = function(matchId, memberId) {
    if (!window._isLoggedIn?.() || !_S) return;
    const match = (_S.matches||[]).find(m=>m.id==matchId);
    if (!match) return;
    const loser = (match.losers||[]).find(l=>l.memberId==memberId);
    if (loser) loser.paid = !loser.paid;
    setBiaPending(true);
    renderPage(_S);
  };

  window.cancelBiaChanges = function() {
    if (!_lastSavedS) return;
    _S = JSON.parse(JSON.stringify(_lastSavedS));
    setBiaPending(false);
    renderPage(_S);
  };

  window.saveBiaChanges = async function() {
    if (!_hasBiaChanges || !_S) return;
    const btn = document.getElementById('bia-save-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Đang lưu…'; }
    try {
      await window._saveS?.(_S);
      _lastSavedS = JSON.parse(JSON.stringify(_S));
      setBiaPending(false);
    } catch(e) {
      console.error(e);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Lưu'; }
    }
  };

  document.getElementById('btn-save-match')?.addEventListener('click', async ()=>{
    if(!_S||!window._isLoggedIn?.()) return;
    const date=document.getElementById('match-date').value;
    if(!date){alert('Vui lòng chọn ngày');return;}
    const selected=[], winners=[];
    _team.forEach((v,id)=>{ if(v==='w') winners.push(id); else selected.push({memberId:id, paid:v==='lp'}); });

    const thuThem=window._moneyInput?.parse(document.getElementById('match-thu-them').value)||0;
    const ghiChu=document.getElementById('match-ghi-chu').value.trim();
    const mi=new Date(date).getMonth();
    const yr=parseInt(date.slice(0,4),10); // năm của trận theo ngày trận, không theo năm đang xem
    if(!_S.matches) _S.matches=[];
    if(_editMatchId!==null) {
      const match=_S.matches.find(m=>m.id==_editMatchId);
      if(match) {
        const oldPaid={};(match.losers||[]).forEach(l=>{oldPaid[l.memberId]=l.paid;});
        match.date=date;match.monthIdx=mi;match.year=yr;match.thuThem=thuThem;match.ghiChuThem=ghiChu;
        match.losers=selected.map(s=>({memberId:s.memberId,paid:s.paid}));
        match.winners=winners;
      }
    } else {
      const newId=(_S.nextMaid||1);
      _S.matches.push({id:newId,date,monthIdx:mi,year:yr,thuThem,ghiChuThem:ghiChu,
        losers:selected.map(s=>({memberId:s.memberId,paid:s.paid})),winners});
      _S.nextMaid=newId+1;
    }
    _openMonths.clear(); // chỉ một tháng mở
    _openMonths.add(mi); // mở tháng vừa thêm/sửa trận
    await window._saveS?.(_S);
    _lastSavedS = JSON.parse(JSON.stringify(_S));
    setBiaPending(false);
    closeMatchModal();
    if(yr!==_year){ _year=yr; updateYearUI(); } // trận thuộc năm khác → chuyển sang xem năm đó
    renderPage(_S);
  });

  // ── Accordion ────────────────────────────────────────────
  function renderAccordion(S) {
    const members=(S.members||[]).filter(m=>m.status!=='left');
    const matches=getYearMatches(S);
    const isAdmin=window._isLoggedIn?.();
    const accordion=document.getElementById('month-accordion');
    accordion.innerHTML='';
    let hasAny=false;

    MONTHS.forEach((mn,mi)=>{
      // Sắp xếp toàn bộ trận trong năm theo ngày tăng dần → tính rank
      const allSorted = matches.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const rankMap = {};
      allSorted.forEach((m, i) => { rankMap[m.id] = i + 1; });

      const monthMatches = matches.filter(m=>m.monthIdx===mi)
        .sort((a,b)=>(a.date||'').localeCompare(b.date||'')); // ASC
      if(!monthMatches.length&&!isAdmin) return;
      hasAny=true;
      const isOpen=_openMonths.has(mi);
      let thuBiaMo=0,thuThemMo=0,noBiaMo=0;
      monthMatches.forEach(m=>{(m.losers||[]).forEach(l=>{if(l.paid)thuBiaMo+=FINE;else noBiaMo+=FINE;});thuThemMo+=(m.thuThem||0);});
      const tongMo=thuBiaMo+thuThemMo;

      const summaryChips=monthMatches.length?`<div class="month-summary-chips">
        <span class="month-chip">${monthMatches.length} trận</span>
        <span class="month-chip month-chip--total" title="Tổng thu tháng"><span class="chip-full">Σ: ${fmtK(tongMo)}</span><span class="chip-short">Σ ${chipK(tongMo)}</span></span>
        ${thuThemMo?`<span class="month-chip month-chip--extra" title="Thu thêm"><span class="chip-full">Thêm: +${fmtK(thuThemMo)}</span><span class="chip-short">Thêm ${chipK(thuThemMo)}</span></span>`:''}
        ${noBiaMo?`<span class="month-chip month-chip--debt" title="Còn nợ"><span class="chip-full">Nợ: ${fmtK(noBiaMo)}</span><span class="chip-short">Nợ ${chipK(noBiaMo)}</span></span>`:''}
      </div>`:'';

      const matchesHTML=monthMatches.map(match=>{
        const losersHTML=(match.losers||[]).map(l=>{
          const member=members.find(m=>m.id==l.memberId);
          const cls=l.paid?'loser-paid':'loser-unpaid';
          const icon=l.paid?'solar:check-circle-linear':'solar:close-circle-linear';
          const ca=isAdmin?`onclick="togglePaid(${match.id},${l.memberId})" style="cursor:pointer"`:'';
          return `<span class="loser-chip ${cls}" ${ca}><iconify-icon icon="${icon}" style="font-size:13px"></iconify-icon>${member?.name||'?'}</span>`;
        }).join('');
        const winnerIds=getWinnerIds(match);
        const winnersHTML=winnerIds.map(memberId=>{
          const member=members.find(m=>m.id==memberId);
          return member?`<span class="winner-chip"><iconify-icon icon="solar:cup-star-linear" style="font-size:13px"></iconify-icon>${member.name}</span>`:'';
        }).join('');
        const paidCount=(match.losers||[]).filter(l=>l.paid).length;
        const winnerCount=winnerIds.length;
        const biaMo=paidCount*FINE;
        const noBiaTran=(match.losers||[]).filter(l=>!l.paid).length*FINE;
        const extraHTML=match.thuThem?`<div class="match-item__extra">🎁 Thu thêm: +${fmtK(match.thuThem)}${match.ghiChuThem?` — ${match.ghiChuThem}`:''}</div>`:'';
        const adminBtns=isAdmin?`<div style="display:flex;gap:4px;margin-left:auto">
          <button class="btn btn-icon btn-ghost" onclick="openEditMatch(${match.id})" title="Sửa" style="color:var(--color-primary);width:36px;height:36px"><iconify-icon icon="solar:pen-2-linear" style="font-size:16px"></iconify-icon></button>
          <button class="btn btn-icon btn-ghost" onclick="deleteMatch(${match.id})" title="Xoá" style="color:var(--text-muted);width:36px;height:36px"><iconify-icon icon="solar:trash-bin-trash-linear" style="font-size:16px"></iconify-icon></button>
        </div>`:'';
        return `<div class="match-item fade-in">
          <div class="match-item__header">
            <div class="match-item__num">#${rankMap[match.id]||'?'}</div>
            <div class="match-item__date">${fmtDate(match.date)}</div>
            ${adminBtns}
          </div>
          <div class="match-item__team-row">
            <div class="match-item__team-label">Đội thua</div>
            <div class="match-item__losers">${losersHTML||'<span style="font-size:12px;color:var(--text-muted)">Chưa chọn</span>'}</div>
          </div>
          ${winnersHTML?`<div class="match-item__team-row">
            <div class="match-item__team-label">Đội thắng</div>
            <div class="match-item__losers">${winnersHTML}</div>
          </div>`:''}
          ${extraHTML}
          <div class="match-item__summary">Quỹ bia: ${fmtK(biaMo)}${winnerCount?` · Thắng: ${winnerCount} người`:''}${noBiaTran?` · <span style="color:var(--color-primary)">Nợ: ${fmtK(noBiaTran)}</span>`:''}${match.thuThem?` · Thu thêm: +${fmtK(match.thuThem)}`:''}</div>
        </div>`;
      }).join('');

      const addBtn=isAdmin?`<div class="month-add-wrap">
        <button class="btn btn-outline w-full" onclick="openAddMatch(${mi})" style="justify-content:center;">
          <iconify-icon icon="solar:add-circle-linear" style="font-size:18px"></iconify-icon>Thêm trận ${MONTHS_FULL[mi]}
        </button>
      </div>`:'';

      const card=document.createElement('div');
      card.className=`month-accordion-card${isOpen?' is-open':''}`;
      card.dataset.mi=mi;
      card.innerHTML=`
        <div class="month-accordion-header" onclick="toggleAccordion(${mi})" role="tab" aria-selected="${isOpen}">
          <span class="month-accordion-title">${MONTHS_FULL[mi]}</span>
          <iconify-icon icon="solar:alt-arrow-down-linear" class="month-accordion-chevron"></iconify-icon>
        </div>
        <div class="month-accordion-body">
          ${summaryChips}
          <div style="display:flex;flex-direction:column;gap:10px">${matchesHTML}</div>
          ${addBtn}
        </div>`;
      accordion.appendChild(card);
    });

    if(!hasAny) {
      accordion.innerHTML=`<div class="month-empty" style="text-align:center;color:var(--text-muted);padding:48px 0">
        <iconify-icon icon="solar:cup-star-linear" style="font-size:48px;opacity:.3"></iconify-icon>
        <div style="margin-top:12px">Chưa có trận nào trong năm ${_year}</div>
      </div>`;
    }
    layoutMonthGrid();
  }

  // Xếp lưới tháng: ô tháng thứ i có order = 2i; khung trận của tháng đang mở
  // chèn ngay sau hàng chứa tháng đó (order = 2 × ô cuối hàng + 1), các hàng
  // sau bị đẩy xuống dưới khung.
  function layoutMonthGrid(){
    const grid=document.getElementById('month-accordion');
    if(!grid) return;
    // Thu cửa sổ từ desktop (mở nhiều tháng) về điện thoại (kiểu tab): giữ một tháng
    if(_openMonths.size>1){
      const keep=Math.max(..._openMonths); _openMonths.clear(); _openMonths.add(keep);
      grid.querySelectorAll('.month-accordion-card').forEach(c=>c.classList.toggle('is-open', Number(c.dataset.mi)===keep));
    }
    const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length||3;
    const headers=[...grid.querySelectorAll('.month-accordion-header')];
    headers.forEach((h,i)=>{ h.style.order=String(i*2); });
    grid.querySelectorAll('.month-accordion-card').forEach(card=>{
      const h=card.querySelector('.month-accordion-header'), body=card.querySelector('.month-accordion-body');
      const i=headers.indexOf(h); if(i<0||!body) return;
      const rowEnd=Math.min(Math.floor(i/cols)*cols+cols-1, headers.length-1);
      body.style.order=String(rowEnd*2+1);
      const col=i%cols;
      body.dataset.col = col===0 ? 'first' : col===cols-1 ? 'last' : 'mid';
      h.dataset.col = body.dataset.col;
    });
  }
  window.addEventListener('resize', layoutMonthGrid);

  // Mỗi lần chỉ mở một tháng (kiểu tab); bấm lại tháng đang mở thì đóng
  const isMonthTabs=()=>true; // lưới tháng kiểu tab trên mọi cỡ màn hình: mỗi lần một tháng
  window.toggleAccordion=function(mi){
    const wasOpen=_openMonths.has(mi);
    if(isMonthTabs()) _openMonths.clear(); else _openMonths.delete(mi);
    if(!wasOpen)_openMonths.add(mi);
    document.querySelectorAll('.month-accordion-card').forEach(card=>{
      const open=_openMonths.has(Number(card.dataset.mi));
      card.classList.toggle('is-open',open);
      card.querySelector('.month-accordion-header')?.setAttribute('aria-selected',String(open));
    });
    layoutMonthGrid();
  };

  function renderPage(S) {
    _S=S;
    const members=(S.members||[]).filter(m=>m.status!=='left');
    const matches=getYearMatches(S);
    let thuBia=0,noBia=0; const nguoiNoSet=new Set();
    matches.forEach(m=>{
      (m.losers||[]).forEach(l=>{if(l.paid)thuBia+=FINE;});
      thuBia+=(m.thuThem||0);
    });
    // Còn nợ / Người còn nợ: cộng dồn các trận thua chưa nộp từ năm gốc tới năm đang xem
    (S.matches||[]).filter(m=>window._fcFinance.matchYear(m)<=_year).forEach(m=>{
      (m.losers||[]).forEach(l=>{if(!l.paid){noBia+=FINE;nguoiNoSet.add(l.memberId);}});
    });
    document.getElementById('kpi-thu-bia').textContent=fmt(thuBia);
    document.getElementById('kpi-con-no').textContent=fmt(noBia);
    document.getElementById('kpi-so-tran').textContent=matches.length;
    document.getElementById('kpi-nguoi-no').textContent=nguoiNoSet.size;
    // Xếp hạng & chuỗi phong độ đã chuyển sang trang Thống kê (thong-ke.html)
    renderAccordion(S);
  }


  window.deleteMatch = function(matchId) {
    if(!window._isLoggedIn?.()||!_S) return;
    const match = (_S.matches||[]).find(m=>m.id==matchId);
    const dateLabel = match?.date ? match.date.split('-').reverse().join('/') : `#${matchId}`;

    // Hiện confirm modal
    const old = document.getElementById('delete-confirm-modal');
    if(old) old.remove();
    const backdrop = document.createElement('div');
    backdrop.id = 'delete-confirm-modal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal fade-in" style="max-width:380px">
        <div class="modal-handle"></div>
        <div style="text-align:center;margin-bottom:20px">
          <div style="width:56px;height:56px;border-radius:var(--radius-full);background:rgba(224,57,44,.12);
            border:1.5px solid rgba(224,57,44,.3);display:flex;align-items:center;justify-content:center;
            margin:0 auto 16px;font-size:24px">
            <iconify-icon icon="solar:trash-bin-trash-linear" style="color:var(--color-accent-light)"></iconify-icon>
          </div>
          <div style="font-size:17px;font-weight:700;margin-bottom:6px">Xoá trận đấu?</div>
          <div style="font-size:13px;color:var(--text-secondary)">
            Trận ngày <strong style="color:var(--text-primary)">${dateLabel}</strong> sẽ bị xoá vĩnh viễn và không thể khôi phục.
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-cancel btn-surface w-full" id="btn-delete-cancel" style="justify-content:center">Huỷ</button>
          <button class="btn btn-primary w-full" id="btn-delete-confirm" style="justify-content:center;background:var(--color-accent);color:#fff">
            <iconify-icon icon="solar:trash-bin-trash-linear" style="font-size:16px;color:#fff"></iconify-icon>
            Xoá
          </button>
        </div>
      </div>`;

    document.body.appendChild(backdrop);
    window._lockScroll?.();

    const close = () => { backdrop.remove(); window._unlockScroll?.(); };
    backdrop.addEventListener('click', e => { if(e.target===backdrop) close(); });
    document.getElementById('btn-delete-cancel').addEventListener('click', close);
    document.getElementById('btn-delete-confirm').addEventListener('click', async () => {
      _S.matches = (_S.matches||[]).filter(m=>m.id!=matchId);
      await window._saveS?.(_S);
      close();
      renderPage(_S);
    });
  };

  function updateYearUI(){
    const sel=document.getElementById('year-select');
    if(sel){
      const curY=new Date().getFullYear(),minY=BASE_YEAR,maxY=Math.max(curY,BASE_YEAR); // tới năm hiện tại, không +1
      sel.innerHTML='';
      for(let y=maxY;y>=minY;y--){const opt=document.createElement('option');opt.value=y;opt.textContent=y;if(y===_year)opt.selected=true;sel.appendChild(opt);}
      sel.disabled = sel.options.length <= 1; // chỉ một năm thì không mở danh sách
    }
    window._currentYear=_year;
  }

  window.onComponentsReady=function(){
    updateYearUI();
    document.getElementById('year-select')?.addEventListener('change',e=>{
      _year=parseInt(e.target.value)||BASE_YEAR; updateYearUI(); if(_S) renderPage(_S);
    });
    document.getElementById('page-content').style.opacity='1';
  };
  window._onDataReady=function(S){
    _lastSavedS = JSON.parse(JSON.stringify(S));
    renderPage(S);
  };
  window._onAuthChange=function(){if(_S)renderPage(_S);};
</script>
<div class="sheet-backdrop" id="login-modal" style="display:none" role="dialog" aria-modal="true">
  <div class="sheet fade-in">
    <div class="modal-handle" style="display:block"></div>
    <div class="dlg-head">
      <div class="dlg-head__text"><h2 class="dlg-head__title" id="login-title">Đăng nhập</h2></div>
      <button class="btn btn-close" type="button" aria-label="Đóng" onclick="document.getElementById('btn-login-cancel')?.click()"><svg class="btn-close__ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="field">
        <label for="login-email">Email</label>
        <input class="input" type="email" id="login-email" placeholder="email@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Mật khẩu</label>
        <input class="input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="login-error" style="display:none;background:rgba(224,57,44,.12);border:1px solid rgba(224,57,44,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--color-accent-light)">
        <iconify-icon icon="solar:close-circle-linear" style="vertical-align:middle;margin-right:4px"></iconify-icon>
        <span id="login-error-msg">Tên đăng nhập hoặc mật khẩu không đúng.</span>
      </div>
      <div style="display:flex;gap:12px;margin-top:4px">
        <button class="btn btn-cancel btn-ghost" id="btn-login-cancel" style="flex-shrink:0">Huỷ</button>
        <button class="btn btn-primary w-full" id="btn-login-submit" style="justify-content:center">
          <iconify-icon icon="solar:lock-unlocked-linear" style="font-size:18px"></iconify-icon>
          Đăng nhập
        </button>
      </div>
    </div>
  </div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW register failed:', err));
    });
  }
</script>
