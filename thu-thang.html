<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>
    /* Theme: apply trước khi render để tránh flash */
    (function(){
      var t = localStorage.getItem('fc-sunday-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0C0C0F">
  <title>FC Sunday — Thu hàng tháng</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <!-- Mở sẵn kết nối tới máy chủ đăng nhập và database của Firebase -->
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fc-sunday-8f932-default-rtdb.asia-southeast1.firebasedatabase.app" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" async></script>
  <style data-fund-style>
    .thu-thang-table td, .thu-thang-table th { min-width: 52px; text-align: center; }
    .thu-thang-table th.month-col, .thu-thang-table td.month-col { width: 42px; min-width: 40px; max-width: 60px; }
    .thu-thang-table th:last-child, .thu-thang-table td:last-child { text-align: right; }
    .thu-thang-table th.stt-col, .thu-thang-table td.stt-col { width: 44px; min-width: 44px; max-width: 44px; text-align: center; }
    .thu-thang-table th.name-col, .thu-thang-table td.name-col { text-align: left; min-width: 120px; }
    .cell-btn {
      width: 40px; height: 32px;
      border-radius: var(--radius-sm);
      border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
      transition: background .12s, transform .1s;
    }
    .cell-btn:active { transform: scale(.93); }
    /* Dark mode (default) */
    .cell-paid-btn    { background: #2ECC71; color: #FFFFFF; font-weight: 700; }
    .cell-unpaid-btn  { background: #E0392C; color: #FFFFFF; font-weight: 700; }
    .cell-exempt-btn  { background: #FFC02E; color: #FFFFFF; font-style: italic; font-weight: 700; }

    /* Light mode */
    [data-theme="light"] .cell-paid-btn    { background: #2ECC71; color: #FFFFFF; }
    [data-theme="light"] .cell-unpaid-btn  { background: #E0392C; color: #FFFFFF; }
    [data-theme="light"] .cell-exempt-btn  { background: #FFC02E; color: #FFFFFF; }
    .cell-future-btn  { opacity: .72; }
    .summary-row td   { background: var(--bg-elevated) !important; font-weight: 700; }
  </style>
</head>
<body data-active="thu-thang">
<div class="app-shell">
  <div data-component="sidebar"></div>
  <div class="main-content">
    <div data-component="header" data-title="Thu hàng tháng"></div>
    <!-- Thu quỹ: 2 tab Quỹ tháng / Quỹ bia (mỗi tab là một trang), nền liền với header -->
    <div class="fund-tabs-bar">
      <nav class="fund-tabs" aria-label="Thu quỹ">
        <a class="fund-tab active" href="thu-thang.html" aria-current="page"><span class="fund-tab__in"><span class="fund-tab__ic tf" aria-hidden="true">💰</span>Quỹ tháng</span></a>
        <a class="fund-tab" href="thu-phat.html"><span class="fund-tab__in"><span class="fund-tab__ic tf" aria-hidden="true">🍺</span>Quỹ bia</span></a>
      </nav>
    </div>
    <div class="fund-desktop-tabs">
      <div class="section-overline">Thu quỹ</div>
      <nav class="fund-tabs fund-tabs--inline" aria-label="Thu quỹ">
        <a class="fund-tab active" href="thu-thang.html" aria-current="page"><span class="fund-tab__in"><span class="fund-tab__ic tf" aria-hidden="true">💰</span>Quỹ tháng</span></a>
        <a class="fund-tab" href="thu-phat.html"><span class="fund-tab__in"><span class="fund-tab__ic tf" aria-hidden="true">🍺</span>Quỹ bia</span></a>
      </nav>
    </div>
    <main class="page" id="page-content">

      <!-- Header row -->
      <div class="thu-thang-page-header">
        <div class="thu-thang-page-title">
          <h1 class="sr-only">Quỹ tháng</h1>
          <div class="thu-thang-page-subtitle" style="font-size:12px;color:var(--text-muted)">200.000 / người / tháng</div>
        </div>
        <select class="year-selector thu-thang-year-selector" id="year-select">
          <!-- options injected by JS -->
        </select>
      </div>

      <!-- KPI quick -->
      <div class="grid-2 thu-thang-kpi-grid" style="margin-bottom:16px">
        <div class="kpi-card kpi-card--gold">
          <div class="kpi-card__label">Đã thu</div>
          <div class="kpi-card__value" id="kpi-da-thu">0</div>
        </div>
        <div class="kpi-card kpi-card--red">
          <div class="kpi-card__label">Còn thiếu</div>
          <div class="kpi-card__value" id="kpi-con-thieu">0</div>
        </div>
      </div>

      <!-- Khung dính dưới tab khi cuộn: ô tìm kiếm + dòng tiêu đề cột (bản sao của thead, cuộn ngang theo bảng) -->
      <div class="tt-sticky" id="tt-sticky">
        <!-- Search box -->
        <div style="position:relative;margin-bottom:12px">
          <iconify-icon icon="solar:magnifer-linear" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-secondary);z-index:1;pointer-events:none"></iconify-icon>
          <input id="thu-thang-search" class="input" type="text" placeholder="Tìm thành viên..."
            style="width:100%;height:40px;padding:0 12px 0 36px;border-radius:var(--radius-lg);border:1px solid var(--bg-stroke);background:var(--bg-elevated);color:var(--text-primary);font-family:inherit;font-size:16px;box-sizing:border-box;outline:none"
            oninput="filterThuThangTable(this.value)">
        </div>
        <div class="tt-head" id="tt-head" aria-hidden="true" data-scroll-proxy="#tt-wrap"><table class="fc-table thu-thang-table"></table></div>
      </div>

      <div class="save-bar" id="thu-thang-save-bar" hidden>
        <button class="save-bar__btn btn-cancel" id="thu-thang-cancel-btn" type="button" onclick="cancelMonthlyChanges()">Huỷ</button>
        <button class="save-bar__btn save-bar__btn--save" id="thu-thang-save-btn" type="button" onclick="saveMonthlyChanges()">Lưu</button>
      </div>

      <!-- Table -->
      <div class="table-wrap" id="tt-wrap">
        <table class="fc-table thu-thang-table" id="thu-thang-table">
          <thead>
            <tr id="thu-thang-head">
              <th class="sticky-col stt-col">STT</th>
              <th class="sticky-col name-col">Thành viên</th>
              <!-- months injected by JS -->
              <th>Tổng nợ</th>
            </tr>
          </thead>
          <tbody id="thu-thang-tbody">
            <tr><td colspan="15" style="text-align:center;color:var(--text-muted);padding:32px">Đang tải…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Chú thích (cuối bảng) -->
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px">
        <div style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:#2ECC71;display:inline-block"></span><span style="color:var(--text-secondary)">Đã đóng</span></div>
        <div style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:#E0392C;display:inline-block"></span><span style="color:var(--text-secondary)">Chưa đóng</span></div>
        <div style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:#FFC02E;display:inline-block"></span><span style="color:var(--text-secondary)">Miễn</span></div>
      </div>

    </main>
  </div>
  <div data-component="bottom-nav"></div>
</div>
<div data-component="login-modal"></div>
<script src="date-picker.js" defer></script>
<script src="components/thu-thang.js" defer></script>
<script src="components/thu-phat.js" defer></script>
<script src="components/fund-tabs.js" defer></script>
<script src="app.js" defer></script>
<script src="components/components-loader.js" defer></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW register failed:', err));
    });
  }
</script>
</body>
</html>
